  - "按 CAD 机械臂安装基准确认 arm_mount；trial 值 xyz=-0.0225 0 0.514, rpy=0 0 0"
  - "用实测名义平台推力替换 URDF effort=6，并确认额定载荷"
  - "人工检查 convex-hull collision；platform_link 的单凸包可能过于保守"
  - "发布前统一 PCB/firmware 的现有 model 名 lift_70 与本产品标识 lifta70"
