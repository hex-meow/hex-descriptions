  - "tcp 位置按 CAD 抓取中心修正(现 z=0.13 占位)"
  - "齿轮闭合旋向真机确认(URDF 头部第 4 条配方);传动比/行程实测后同步 hex-controller GR80 模型(ratio/pos_max/opening_poly)"
